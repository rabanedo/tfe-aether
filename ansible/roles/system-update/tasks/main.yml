---
- name: Refresh cache if last was more than 3600 seconds ago
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Update all system packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true

- name: Install the latest version of the necessary packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: latest

- name: Check if the system requires a restart
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Restart the server if necessary
  ansible.builtin.reboot:
    msg: "Restarting the system due to Ansible updates"
    connect_timeout: 3
    reboot_timeout: 120
    pre_reboot_delay: 0
    post_reboot_delay: 10
  when: reboot_required_file.stat.exists

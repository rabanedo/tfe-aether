---
- name: Install NFS server packages
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: true

- name: Create export directory (Server)
  ansible.builtin.file:
    path: "{{ nfs_export_path }}"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_group }}"
    mode: "0775"

- name: Configure /etc/exports to allow client access
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ nfs_export_path }} {{ nfs_allowed_clients }}(rw,sync,no_subtree_check,no_root_squash)"
    state: present
  notify: Restart NFS Server

- name: Forzar el reinicio del servidor NFS antes de que el cliente se conecte
  ansible.builtin.meta: flush_handlers

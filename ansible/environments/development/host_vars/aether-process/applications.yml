---
apt_packages:
  - curl
  - wget
  - unzip
  - git
  - acl
  - python3
  - python3-pip
  - build-essential

# S2 products to be generated by default in the workspace
s2_process_command: /opt/cdse-api/conda_envs/cdse-api/bin/python
s2_script_path: /opt/cdse-api/app/services/rgb_ndvi.py
s2_process_params: "--product_list RGB1184 NDVIb --product_folders"
s2_output_path: /dwh/products/S2/derived_products
s2_tmp_path: /dwh/tmp

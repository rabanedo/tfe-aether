[defaults]
# Default inventory (overwrite with -i environments/production/hosts.ini)
inventory             = environments/development/hosts.ini
roles_path            = roles
host_key_checking     = False
retry_files_enabled   = False
stdout_callback       = default
result_format         = yaml
callbacks_enabled     = profile_tasks, timer
gathering             = smart
fact_caching          = memory

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
pipelining   = True
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s
